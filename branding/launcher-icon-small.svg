<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Aver Launcher app icon, SMALL-SIZE VARIANT - PLACEHOLDER. Used for the 16/20/24 px entries of
    the .ico; see launcher-mark-small.svg for why the pad is heavier here.

    The tile corner radius is also reduced. A 56-unit radius on a 16 px tile eats the corners
    entirely and the icon reads as a circle rather than as a squircle beside the engine's.
  -->
  <rect width="256" height="256" rx="40" fill="#161618"/>

  <path d="M128 44 L188 78 L128 112 L68 78 Z"    fill="#F26B21"/>
  <path d="M68 78 L128 112 L128 152 L68 118 Z"   fill="#B4501A"/>
  <path d="M188 78 L128 112 L128 152 L188 118 Z" fill="#8A3410"/>

  <rect x="38" y="190" width="180" height="22" rx="11" fill="#F26B21"/>
</svg>
