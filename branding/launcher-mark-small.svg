<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Aver Launcher mark, SMALL-SIZE VARIANT - PLACEHOLDER.

    Same design, redrawn for 16-24 px. An .ico may carry different artwork per size, and this one
    must, because the pad is the ONLY thing distinguishing this mark from the engine's cube: at
    16 px the master's 13-unit bar renders under a pixel and the two icons become the same picture
    in the taskbar.

    Three changes, all in service of the silhouette surviving downscaling:
      - the bar is thicker (22 vs 13) and wider, so it holds a full pixel row at 16 px
      - the gap between cube and bar is opened up, so they do not blur into one blob
      - the cube is scaled down slightly to make room without growing the overall mark
      - the contact shadow is dropped; below 32 px it is noise
  -->

  <!-- Cube, ~12% smaller and raised, to clear the heavier bar. -->
  <path d="M128 44 L188 78 L128 112 L68 78 Z"    fill="#F26B21"/>
  <path d="M68 78 L128 112 L128 152 L68 118 Z"   fill="#B4501A"/>
  <path d="M188 78 L128 112 L128 152 L188 118 Z" fill="#8A3410"/>

  <!-- The pad: heavier and wider than the master's, and set further below the cube. -->
  <rect x="38" y="190" width="180" height="22" rx="11" fill="#F26B21"/>
</svg>
